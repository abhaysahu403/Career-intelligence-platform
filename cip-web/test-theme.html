<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Theme Test</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>
</head>
<body class="min-h-screen bg-slate-50 dark:bg-slate-900 text-slate-900 dark:text-white transition-colors duration-300">
    <div class="container mx-auto p-8">
        <h1 class="text-4xl font-bold mb-8">Theme Test</h1>
        
        <div class="mb-8">
            <button 
                onclick="toggleTheme()" 
                class="px-6 py-3 bg-sky-500 hover:bg-sky-600 text-white rounded-lg font-bold"
            >
                Toggle Theme
            </button>
        </div>

        <div class="grid gap-4">
            <div class="p-6 bg-white dark:bg-slate-800 rounded-lg border border-slate-200 dark:border-slate-700">
                <h2 class="text-2xl font-bold mb-2">Card Title</h2>
                <p class="text-slate-600 dark:text-slate-400">This is a test card. The background and text should change when you toggle the theme.</p>
            </div>

            <div class="p-6 bg-white dark:bg-slate-800 rounded-lg border border-slate-200 dark:border-slate-700">
                <h2 class="text-2xl font-bold mb-2">Another Card</h2>
                <p class="text-slate-600 dark:text-slate-400">If this works, then Tailwind dark mode is configured correctly.</p>
            </div>
        </div>

        <div class="mt-8 p-4 bg-yellow-100 dark:bg-yellow-900 border border-yellow-300 dark:border-yellow-700 rounded-lg">
            <p class="text-yellow-900 dark:text-yellow-100">
                <strong>Current HTML class:</strong> <span id="current-class"></span>
            </p>
        </div>
    </div>

    <script>
        function toggleTheme() {
            const html = document.documentElement;
            const currentTheme = html.classList.contains('dark') ? 'dark' : 'light';
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            
            html.classList.remove('light', 'dark');
            html.classList.add(newTheme);
            
            updateClassDisplay();
            console.log('Theme toggled from', currentTheme, 'to', newTheme);
        }

        function updateClassDisplay() {
            const html = document.documentElement;
            document.getElementById('current-class').textContent = html.className;
        }

        // Update on load
        updateClassDisplay();
    </script>
</body>
</html>
